<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Кинотека</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="description" content="Личная кинотека: каталог фильмов и сериалов, своя библиотека, без рекламы." />
    <meta name="theme-color" content="#07080d" />
    <meta name="color-scheme" content="dark" />

    <!-- iPad / iPhone: full-screen when added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Кинотека" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Warm up the artwork origin before the first poster is requested. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />

    <style>
      /* Inline so a television shows the brand instead of a white flash while
         the bundle downloads over a slow set-top network stack. */
      html, body { margin: 0; background: #07080d; color: #fff; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; font: 600 24px/1 system-ui, sans-serif;
        letter-spacing: .18em; text-transform: uppercase; color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Кинотека</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
